<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的小宇宙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #fff5f7; }
    #bg-music { display: none; }

    #content-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 浮动音乐按钮 */
    #music-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: #f47298;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(244, 114, 152, 0.45);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #music-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(244, 114, 152, 0.55);
    }
    #music-toggle:active {
      transform: translateY(0);
      box-shadow: 0 2px 12px rgba(244, 114, 152, 0.35);
    }

    #music-toggle svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    #music-label {
      white-space: nowrap;
    }

    /* 首次播放提示 */
    #music-hint {
      position: fixed;
      bottom: 86px;
      right: 24px;
      z-index: 9998;
      max-width: 220px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.95);
      color: var(--ink);
      border-radius: var(--r-lg);
      font-size: 13px;
      line-height: 1.4;
      box-shadow: var(--shadow-2);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    #music-hint.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #music-hint::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 20px;
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.95);
      transform: rotate(45deg);
    }

    @media (max-width: 768px) {
      #music-toggle {
        bottom: 16px;
        right: 16px;
        padding: 10px 14px;
        font-size: 13px;
      }
      #music-label {
        display: none;
      }
      #music-hint {
        bottom: 72px;
        right: 16px;
        max-width: 180px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <audio id="bg-music" src="assets/music/there-is-romance.mp3" loop preload="metadata"></audio>

  <iframe id="content-frame" src="pages/home-20260808h.html" title="内容区"></iframe>

  <button id="music-toggle" aria-label="播放背景音乐">
    <!-- 播放图标 -->
    <svg id="music-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
    <!-- 暂停图标 -->
    <svg id="music-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <span id="music-label">播放音乐</span>
  </button>

  <div id="music-hint">点击任意位置，开启背景音乐</div>

  <script>
  /* ──── 恋爱小站 - 音乐播放器（壳层，音频元素永不销毁）──── */
  (function () {
    'use strict';

    var music = document.getElementById('bg-music');
    var toggle = document.getElementById('music-toggle');
    var label = document.getElementById('music-label');
    var iconOn = document.getElementById('music-icon-on');
    var iconOff = document.getElementById('music-icon-off');
    var hint = document.getElementById('music-hint');
    var frame = document.getElementById('content-frame');

    if (!music || !toggle || !label || !frame) return;

    var KEY_TIME = 'love-music-time';
    var KEY_VOLUME = 'love-music-volume';
    var KEY_USER_PAUSED = 'love-music-user-paused';
    var SAVE_INTERVAL = 5000;

    music.loop = true;
    music.preload = 'metadata';
    music.volume = readNumber(KEY_VOLUME, 0.35);
    music.muted = false;

    var loadFailed = false;
    var isPending = false;
    var unlockRegistered = false;
    var autoplayAttempted = false;
    var hintTimer = null;
    var lastSavedTime = 0;
    var userPaused = readStorage(KEY_USER_PAUSED) === '1';
    var userGesturePlayInFlight = false;

    function readStorage(key) {
      try { return sessionStorage.getItem(key); } catch (err) { return null; }
    }

    function writeStorage(key, value) {
      try { sessionStorage.setItem(key, value); } catch (err) {}
    }

    function removeStorage(key) {
      try { sessionStorage.removeItem(key); } catch (err) {}
    }

    function readNumber(key, fallback) {
      var value = parseFloat(readStorage(key));
      return Number.isFinite(value) ? value : fallback;
    }

    function getSavedTime() {
      return Math.max(0, parseInt(readStorage(KEY_TIME), 10) || 0);
    }

    function saveTime(force) {
      if (music.currentTime <= 0) return;
      var now = Date.now();
      if (!force && now - lastSavedTime < SAVE_INTERVAL) return;
      lastSavedTime = now;
      writeStorage(KEY_TIME, String(Math.floor(music.currentTime)));
    }

    function restoreTimeWhenReady() {
      var savedTime = getSavedTime();
      if (!savedTime) return;

      function seekToSaved() {
        if (music.duration > 0 && Math.abs(music.currentTime - savedTime) > 2) {
          music.currentTime = Math.min(savedTime, Math.max(0, music.duration - 1));
        }
      }

      if (music.readyState >= 1) {
        seekToSaved();
      } else {
        music.addEventListener('loadedmetadata', function once() {
          seekToSaved();
          music.removeEventListener('loadedmetadata', once);
        });
      }
    }

    function updateIcon() {
      if (!iconOn || !iconOff) return;
      iconOn.style.display = music.paused ? 'none' : '';
      iconOff.style.display = music.paused ? '' : 'none';
    }

    function getMusicState() {
      return {
        type: 'music:state',
        paused: music.paused,
        loadFailed: loadFailed,
        userPaused: userPaused,
        currentTime: music.currentTime || 0
      };
    }

    function syncFrameMusicUI() {
      try {
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage(getMusicState(), '*');
        }
      } catch (err) {}
    }

    function updateLabel() {
      if (loadFailed) {
        label.textContent = '加载失败';
        toggle.setAttribute('aria-label', '音乐加载失败');
        toggle.style.opacity = '0.7';
      } else if (music.paused) {
        label.textContent = '播放音乐';
        toggle.setAttribute('aria-label', '播放背景音乐');
        toggle.style.opacity = '1';
      } else {
        label.textContent = '暂停音乐';
        toggle.setAttribute('aria-label', '暂停背景音乐');
        toggle.style.opacity = '1';
      }
      updateIcon();
      syncFrameMusicUI();
    }

    function showHint() {
      if (!hint || userPaused || !music.paused) return;
      hint.classList.add('visible');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(function () {
        hint.classList.remove('visible');
      }, 4500);
    }

    function hideHint() {
      if (!hint) return;
      clearTimeout(hintTimer);
      hint.classList.remove('visible');
    }

    function removeUnlockListeners() {
      if (!unlockRegistered) return;
      unlockRegistered = false;
      document.removeEventListener('pointerdown', onUnlockEvent, true);
      document.removeEventListener('touchstart', onUnlockEvent, true);
      document.removeEventListener('click', onUnlockEvent, true);
      document.removeEventListener('keydown', onUnlockEvent, true);
    }

    function registerUnlockListeners() {
      if (unlockRegistered || userPaused || !music.paused) return;
      unlockRegistered = true;
      document.addEventListener('pointerdown', onUnlockEvent, { capture: true, passive: true });
      document.addEventListener('touchstart', onUnlockEvent, { capture: true, passive: true });
      document.addEventListener('click', onUnlockEvent, { capture: true, passive: true });
      document.addEventListener('keydown', onUnlockEvent, true);
    }

    function onUnlockEvent(e) {
      if (e && e.target && e.target.closest && e.target.closest('#music-toggle')) return;
      unlockFromInteraction();
    }

    function attemptPlay(reason) {
      if (isPending) {
        if (reason !== 'manual' && reason !== 'unlock') return Promise.resolve(false);
        if (userGesturePlayInFlight) return Promise.resolve(false);
        userGesturePlayInFlight = true;
      }
      if (userPaused && reason !== 'manual') return Promise.resolve(false);
      if (!music.paused) {
        userGesturePlayInFlight = false;
        removeUnlockListeners();
        hideHint();
        updateLabel();
        return Promise.resolve(true);
      }

      restoreTimeWhenReady();
      isPending = true;
      return music.play().then(function () {
        isPending = false;
        loadFailed = false;
        userPaused = false;
        if (reason === 'manual' || reason === 'unlock') userGesturePlayInFlight = false;
        removeStorage(KEY_USER_PAUSED);
        removeUnlockListeners();
        hideHint();
        saveTime(true);
        updateLabel();
        return true;
      }).catch(function () {
        isPending = false;
        if (reason === 'manual' || reason === 'unlock') userGesturePlayInFlight = false;
        if (!userPaused) {
          registerUnlockListeners();
          showHint();
        }
        updateLabel();
        return false;
      });
    }

    function attemptAutoplay() {
      if (autoplayAttempted || userPaused) return;
      autoplayAttempted = true;
      attemptPlay('autoplay');
    }

    function unlockFromInteraction() {
      if (userPaused) return;
      attemptPlay('unlock');
    }

    function pauseMusicByUser() {
      userPaused = true;
      writeStorage(KEY_USER_PAUSED, '1');
      removeUnlockListeners();
      hideHint();
      saveTime(true);
      music.pause();
      updateLabel();
    }

    function toggleMusic() {
      if (music.paused) {
        userPaused = false;
        removeStorage(KEY_USER_PAUSED);
        attemptPlay('manual');
      } else {
        pauseMusicByUser();
      }
    }

    music.addEventListener('error', function () {
      loadFailed = true;
      isPending = false;
      updateLabel();
    });

    music.addEventListener('canplay', function () {
      if (loadFailed) loadFailed = false;
      updateLabel();
    });

    music.addEventListener('play', function () {
      saveTime(true);
      updateLabel();
    });

    music.addEventListener('pause', function () {
      saveTime(true);
      updateLabel();
    });

    music.addEventListener('timeupdate', function () {
      saveTime(false);
    });

    music.addEventListener('volumechange', function () {
      writeStorage(KEY_VOLUME, String(music.volume));
    });

    window.addEventListener('pagehide', function () {
      saveTime(true);
    });

    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      toggleMusic();
    });

    restoreTimeWhenReady();
    updateLabel();
    attemptAutoplay();

    /* ══════════════════════════════════════════════
       iframe 内容管理：导航拦截 + 样式注入 + URL 同步
       ══════════════════════════════════════════════ */

    var BASE_PAGE = 'pages/home-20260808h.html';
    var ALLOWED_PAGES = {
      'pages/home-20260808h.html': true,
      'pages/index.html': true,
      'pages/love-album.html': true,
      'pages/love-list.html': true,
      'pages/little-things.html': true,
      'pages/about-us.html': true,
      'pages/leaving.html': true
    };
    var currentPage = BASE_PAGE;

    function normalizeAllowedPage(page) {
      if (!page) return BASE_PAGE;
      if (page.indexOf('/') === 0) page = page.slice(1);
      if (page.indexOf('pages/') !== 0) page = 'pages/' + page;
      if (!/\.html(?:$|\?)/.test(page)) page += '.html';
      var clean = page.split('?')[0];
      return ALLOWED_PAGES[clean] ? clean : BASE_PAGE;
    }

    // 从 URL 读取初始页面
    function getPageFromURL() {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('page');
      if (p) return normalizeAllowedPage('pages/' + p);
      var hash = window.location.hash;
      if (hash && hash.startsWith('#/')) {
        return normalizeAllowedPage('pages/' + hash.slice(2));
      }
      return BASE_PAGE;
    }

    function updateURL(page) {
      // 从 pages/xxx.html 提取页面名
      var name = page.replace(/^pages\//, '').replace(/\.html$/, '');
      var base = window.location.pathname;
      var params = new URLSearchParams(window.location.search);
      var local = params.get('local');
      var newSearch = '';
      if (name === 'index') {
        if (local === '1') newSearch = '?local=1';
      } else {
        newSearch = '?page=' + name;
        if (local === '1') newSearch += '&local=1';
      }
      var newURL = base + newSearch;
      if (window.location.search !== newSearch) {
        history.pushState({ page: page }, '', newURL);
      }
    }

    function navigateTo(page) {
      page = normalizeAllowedPage(page);
      if (page === currentPage) return;
      currentPage = page;
      updateURL(page);
      // 先移除旧 frame 的事件绑定，再加载新页面
      frame.src = buildFrameSrc(page);
    }

    function buildFrameSrc(page) {
      var params = new URLSearchParams(window.location.search);
      var local = params.get('local');
      if (local === '1') {
        var sep = page.indexOf('?') >= 0 ? '&' : '?';
        return page + sep + 'local=1';
      }
      return page;
    }

    // 注入样式到 iframe，隐藏历史页面内残留的音频元素
    function injectHideStyles() {
      try {
        var doc = frame.contentDocument;
        if (!doc) return;
        // 移除可能已存在的注入样式
        var existing = doc.getElementById('shell-hide-style');
        if (existing) return;
        var style = doc.createElement('style');
        style.id = 'shell-hide-style';
        style.textContent = '#bg-music { display: none !important; }';
        doc.head.appendChild(style);
      } catch (e) { /* 跨域或其他错误，忽略 */ }
    }

    // 注入导航拦截脚本到 iframe
    function injectNavHandler() {
      try {
        var doc = frame.contentDocument;
        if (!doc) return;
        // 检查是否已注入
        if (doc.getElementById('shell-nav-handler')) return;

        var script = doc.createElement('script');
        script.id = 'shell-nav-handler';
        script.textContent = [
          '(function(){',
          '  "use strict";',
          '  document.addEventListener("click",function(e){',
          '    var a=e.target.closest("a");',
          '    if(!a)return;',
          '    var href=a.getAttribute("href");',
          '    if(!href||href.startsWith("#")||href.startsWith("http://")||href.startsWith("https://")||href.startsWith("//")||href.startsWith("javascript:")||href.startsWith("mailto:")||href.startsWith("tel:"))return;',
          '    if(a.getAttribute("target")==="_blank")return;',
          '    if(a.getAttribute("download")!==null)return;',
          '    e.preventDefault();',
          '    e.stopPropagation();',
          '    // 解析相对路径',
          '    var base=document.baseURI;',
          '    var resolved=new URL(href,base).pathname;',
          '    // 去掉可能的 leading slash',
          '    if(resolved.indexOf("/pages/")===0)resolved=resolved.slice(1);',
          '    else if(resolved.indexOf("pages/")===0)resolved=resolved;',
          '    else{',
          '      // 其他路径，保持原样让父级处理',
          '      window.parent.postMessage({type:"navigate",page:resolved},"*");',
          '      return;',
          '    }',
          '    window.parent.postMessage({type:"navigate",page:resolved},"*");',
          '  });',
          '})();'
        ].join('\n');
        doc.head.appendChild(script);
      } catch (e) { /* 忽略 */ }
    }

    // 监听来自 iframe 的导航消息
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'music:user-interaction') {
        unlockFromInteraction();
        return;
      }
      if (e.data && e.data.type === 'music:toggle') {
        toggleMusic();
        return;
      }
      if (e.data && e.data.type === 'music:request-state') {
        syncFrameMusicUI();
        return;
      }
      if (e.data && e.data.type === 'navigate' && e.data.page) {
        var page = e.data.page;
        // 确保是 pages/ 下的页面
        if (page.indexOf('pages/') === 0 || page.indexOf('/pages/') === 0) {
          if (page.indexOf('/') === 0) page = page.slice(1);
          navigateTo(page);
        }
      }
    });

    // iframe 加载完成后注入
    frame.addEventListener('load', function () {
      injectHideStyles();
      injectNavHandler();
      syncFrameMusicUI();
      // 更新 iframe 内页面的标题到壳层
      try {
        var doc = frame.contentDocument;
        if (doc && doc.title) {
          document.title = doc.title;
        }
      } catch (e) {}
    });

    // 监听浏览器前进/后退
    window.addEventListener('popstate', function (e) {
      var page = BASE_PAGE;
      if (e.state && e.state.page) {
        page = e.state.page;
      } else {
        page = getPageFromURL();
      }
      if (page !== currentPage) {
        currentPage = page;
        frame.src = buildFrameSrc(page);
      }
    });

    // 初始加载
    currentPage = getPageFromURL();
    if (currentPage !== BASE_PAGE) {
      frame.src = buildFrameSrc(currentPage);
      updateURL(currentPage);
    }

    // 暴露 API
    window.LoveMusic = {
      toggle: toggleMusic,
      play: function () { return attemptPlay('manual'); },
      pause: pauseMusicByUser,
      isPlaying: function () { return !music.paused; },
      getCurrentTime: function () { return music.currentTime; },
      getAudio: function () { return music; }
    };

  })();
  </script>
</body>
</html>
