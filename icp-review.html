<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>我们的小宇宙</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #2b2528;
      --muted: #746a70;
      --line: #eadde3;
      --surface: #fffafa;
      --brand: #e85f97;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff6f8;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
    }
    main {
      width: min(100%, 520px);
      padding: 44px 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      text-align: center;
      box-shadow: 0 16px 48px rgba(216, 95, 140, 0.12);
    }
    h1 {
      margin: 0 0 14px;
      color: var(--brand);
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 700;
      letter-spacing: 0;
    }
    p {
      margin: 8px 0 0;
      font-size: 17px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>我们的小宇宙</h1>
    <p>网站备案审核中，暂未开放。</p>
    <p>感谢访问。</p>
  </main>
</body>
</html>
