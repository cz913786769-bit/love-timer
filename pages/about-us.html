.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  color: var(--brand-ink);

.btn-primary:hover { background-color: var(--brand-600); transform: translateY(-1px); }

.btn-secondary {

  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--r-md);

  font-size: 15px;

}
.btn-secondary:hover { border-color: var(--brand); background-color: var(--brand-100); }
.btn-text {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  color: var(--brand);
  border: none;
  padding: 8px 0;
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 4px;

.input {

  font-size: 15px;

.input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-200); }
.input::placeholder { color: var(--ink-3); }
.card {
  background-color: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);

.tag {
  display: inline-flex;
  align-items: center;
  height: 24px;

  border-radius: var(--r-pill);

@media (prefers-reduced-motion: reduce) {

  #hero-section {
    background-attachment: scroll !important;
  }
}

        var dateInput = document.getElementById('letter-date');

        function escapeHtml(text) {
          return String(text).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
          });
        }

        function renderLetter() {
          var letter = LoveData.getLetter();
          var html = '<p>' + escapeHtml(letter.greeting || '') + '</p>';
          (letter.paragraphs || []).forEach(function (p) {
            html += '<p>' + escapeHtml(p) + '</p>';
          });
          viewEl.innerHTML = html;
          signoffEl.textContent = letter.signOff || '';
          datetextEl.textContent = letter.dateText || '';
        }

        function openEdit() {
          var letter = LoveData.getLetter();
          greetingInput.value = letter.greeting || '';
          paragraphsInput.value = (letter.paragraphs || []).join('\n\n');
          signoffInput.value = letter.signOff || '';
          dateInput.value = letter.dateText || '';
          formEl.style.display = 'block';
        }

        function closeEdit() {
          formEl.style.display = 'none';
        }

        toggleEl.addEventListener('click', function () { openEdit(); });
        cancelEl.addEventListener('click', function () { closeEdit(); });

        formEl.addEventListener('submit', function (e) {
          e.preventDefault();
          var letter = {
            greeting: greetingInput.value.trim(),
            paragraphs: paragraphsInput.value.split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean),
            signOff: signoffInput.value.trim(),
            dateText: dateInput.value.trim()
          };
          LoveData.saveLetter(letter);
          renderLetter();
          closeEdit();
          if (window.LoveAdmin && LoveAdmin.toast) LoveAdmin.toast('信件已保存');
        });

        renderLetter();
      })();
    </script>
