    <style id="theme-vars">
@import "tailwindcss";

:root {
  --love-background: #fff5f7;
  --love-foreground: #4a3f41;
  --love-card: #ffffff;
  --love-card-foreground: #4a3f41;
  --love-popover: #ffffff;
  --love-popover-foreground: #4a3f41;
  --love-primary: #f47298;
  --love-primary-foreground: #ffffff;
  --love-muted: #f9e8ed;
  --love-muted-foreground: #8a7b7f;
  --love-border: #f3d8e0;
  --love-input: #ffffff;
  --love-ring: #f47298;
  --love-radius-small: 4px;
  --love-radius-medium: 8px;
  --love-radius-large: 16px;

  --bg: #fff5f7;
  --surface: #ffffff;
  --surface-2: #fef0f3;
  --ink: #4a3f41;
  --ink-2: #6d5e62;
  --ink-3: #9e8f94;
  --line: #f3d8e0;
  --brand: #f47298;
  --brand-ink: #ffffff;
  --brand-100: #ffe4eb;
  --brand-200: #fec6d6;
  --brand-300: #fda1bf;
  --brand-400: #f97da7;
  --brand-500: #f47298;
  --brand-600: #d84e7a;
  --brand-700: #b53761;
  --state-success: #34c759;
  --state-warning: #ff9500;
  --state-error: #ff3b30;
  --state-info: #5ac8fa;

  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 9999px;
  --shadow-1: 0 1px 2px rgba(74, 63, 65, 0.05), 0 1px 1px rgba(74, 63, 65, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(74, 63, 65, 0.15);
  --shadow-3: 0 24px 60px -20px rgba(74, 63, 65, 0.22);

  --font-display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

.dark {
  --love-background: #181214;
  --love-foreground: #f4e8ea;
  --love-card: #221c1e;
  --love-card-foreground: #f4e8ea;
  --love-popover: #221c1e;
  --love-popover-foreground: #f4e8ea;
  --love-primary: #f47298;
  --love-primary-foreground: #ffffff;
  --love-muted: #2d2527;
  --love-muted-foreground: #b5a7ab;
  --love-border: #3b3134;
  --love-input: #221c1e;
  --love-ring: #f47298;

  --bg: #181214;
  --surface: #221c1e;
  --surface-2: #2d2527;
  --ink: #f4e8ea;
  --ink-2: #d6c9cc;
  --ink-3: #a89da0;
  --line: #3b3134;
  --brand: #f47298;
  --brand-ink: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.h1 {
  font-family: var(--font-display);
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
  word-break: keep-all;
}

.h2 {
  font-family: var(--font-display);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  word-break: keep-all;
}

.h3 {
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  word-break: keep-all;
}

.body {
  font-size: 15px;
  line-height: 1.6;
}

.caption {
  font-size: 13px;
  line-height: 1.5;
  letter-spacing: 0.005em;
  color: var(--ink-3);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background-color: var(--brand);
  color: var(--brand-ink);
  border: none;
  border-radius: var(--r-md);
  padding: 12px 20px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: background-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.btn-primary:hover {
  background-color: var(--brand-600);
  transform: translateY(-1px);
}

.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background-color: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 20px;
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
  transition: border-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.btn-secondary:hover {
  border-color: var(--brand);
  background-color: var(--brand-100);
}

.input {
  width: 100%;
  height: 48px;
  padding: 0 16px;
  background-color: var(--love-input);
  color: var(--love-foreground);
  border: 1px solid var(--love-border);
  border-radius: var(--r-md);
  font-size: 15px;
  outline: none;
  transition: border-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 2px var(--brand-200);
}

.input::placeholder { color: var(--ink-3); }

.card {
  background-color: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
}

.nav-link {
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 500;
  transition: color 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.nav-link:hover,
.nav-link[data-active="true"] { color: var(--brand); }

body.admin-page #love-admin-bar,
body.admin-page #love-admin-login-fab { display: none !important; }

.admin-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 24px;
}

@media (max-width: 768px) {
  .admin-layout { grid-template-columns: 1fr; }
}

.admin-menu-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: none;
  background: transparent;
  color: var(--ink-2);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background-color 150ms ease, color 150ms ease;
}

.admin-menu-btn:hover { background: var(--surface-2); color: var(--ink); }
.admin-menu-btn[data-active="true"] { background: var(--brand-100); color: var(--brand-700); }

.admin-list-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.admin-list-item:last-child { border-bottom: none; }

.admin-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--brand-100);
  color: var(--brand);
  font-size: 12px;
  font-weight: 500;
}

.admin-field { margin-bottom: 14px; }

.admin-field label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  color: var(--ink-2);
  font-weight: 500;
}

.admin-field input,
.admin-field textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}

.admin-field input:focus,
.admin-field textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 2px var(--brand-200);
}

.admin-field textarea { resize: vertical; min-height: 80px; }

.admin-small-img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface-2);
  flex-shrink: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 768px) {
  header > div {
    padding: 0 12px;
    gap: 8px;
  }
  header > div > a:first-of-type .logo-text {
    display: none;
  }
  header > div > nav {
    overflow-x: auto;
    white-space: nowrap;
    flex-shrink: 1;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  header > div > nav::-webkit-scrollbar {
    display: none;
  }
  header > div > nav a {
    white-space: nowrap;
  }
  header > div > button#music-toggle > span#music-label {
    display: none;
  }

  /* 性能优化：移动端降低毛玻璃模糊半径，减少 GPU 开销 */
  header,
  .glass,
  .album-group-header {
    backdrop-filter: blur(6px) !important;
    -webkit-backdrop-filter: blur(6px) !important;
  }

  /* 性能优化：移动端禁用 fixed 背景，避免滚动时重绘卡顿 */
  #hero-section {
    background-attachment: scroll !important;
  }
}

    <script>
      (function () {
        if (!window.LoveAdmin || !LoveAdmin.isLoggedIn()) {
          window.location.href = 'admin-login.html';
          return;
        }

        /* 当前账户信息 */
        var currentAccount = LoveAdmin.getCurrentAccount();
        var currentIdentity = LoveAdmin.getCurrentIdentity();

        if (!currentAccount) {
          LoveAdmin.logout();
          window.location.href = 'admin-login.html';
          return;
        }

        function esc(str) {
          return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function fmtDate(iso) {
          try { return new Date(iso).toLocaleString('zh-CN'); } catch (e) { return iso; }
        }

        function creatorBadge(identity) {
          if (!identity) return '';
          var acc = LoveAdmin.getAccount(identity);
          if (!acc) return '';
          var avatarHtml = '';
          if (acc.avatar) {
            avatarHtml = '<div style="width:18px;height:18px;border-radius:50%;overflow:hidden;border:1px solid var(--brand-200);flex-shrink:0;"><img src="' + esc(acc.avatar) + '" style="width:100%;height:100%;object-fit:cover;"></div>';
          }
          return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);">' + avatarHtml + esc(acc.nickname) + '</span>';
        }

        var tabs = [
          { id: 'site', label: '网站设置', icon: 'settings' },
          { id: 'password', label: '修改密码', icon: 'lock' },
          { id: 'avatars', label: '头像管理', icon: 'user-circle' },
          { id: 'cover', label: '封面照片', icon: 'image' },
          { id: 'messages', label: '留言管理', icon: 'message-circle' },
          { id: 'album', label: '相册管理', icon: 'folder-heart' },
          { id: 'wishlist', label: '清单管理', icon: 'check-square' },
          { id: 'timeline', label: '点滴管理', icon: 'coffee' },
          { id: 'letter', label: '信件管理', icon: 'mail' },
          { id: 'backup', label: '备份与恢复', icon: 'save' }
        ];

        var menu = document.getElementById('admin-menu');
        var content = document.getElementById('admin-content');
        var currentTab = 'site';

        function buildMenu() {
          menu.innerHTML = tabs.map(function (t) {
            return '<button class="admin-menu-btn" data-tab="' + esc(t.id) + '">' +
              '<i data-lucide="' + esc(t.icon) + '" style="width:18px;height:18px;"></i>' +
              esc(t.label) + '</button>';
          }).join('');

          menu.querySelectorAll('[data-tab]').forEach(function (btn) {
            btn.addEventListener('click', function () { setTab(this.dataset.tab); });
          });
          updateMenuActive();
        }

        function updateMenuActive() {
          menu.querySelectorAll('[data-tab]').forEach(function (btn) {
            var active = btn.dataset.tab === currentTab;
            btn.dataset.active = active;
          });
        }

        function setTab(id) {
          currentTab = id;
          updateMenuActive();
          renderTab(id);
        }

        function confirmSave(msg, callback) {
          if (confirm(msg || '确定要保存修改吗？')) {
            callback();
          }
        }

        function renderTab(id) {
          switch (id) {
            case 'site': renderSite(); break;
            case 'password': renderPassword(); break;
            case 'avatars': renderAvatars(); break;
            case 'cover': renderCover(); break;
            case 'messages': renderMessages(); break;
            case 'album': renderAlbum(); break;
            case 'wishlist': renderWishlist(); break;
            case 'timeline': renderTimeline(); break;
            case 'letter': renderLetter(); break;
            case 'backup': renderBackup(); break;
          }
          if (window.lucide) lucide.createIcons();
        }

        function siteField(key, label, placeholder) {
          var site = LoveData.getSite();
          return '<div class="admin-field">' +
            '<label>' + esc(label) + '</label>' +
            '<input id="site-' + esc(key) + '" type="text" class="input" value="' + esc(site[key] || '') + '" placeholder="' + esc(placeholder || '') + '">' +
            '</div>';
        }

        function renderSite() {
          content.innerHTML =
            '<h2 class="h2" style="margin:0 0 4px;">网站设置</h2>' +
            '<p class="caption" style="margin:0 0 24px;">编辑首页标题、副标题与页脚文案</p>' +
            '<div class="card" style="padding:24px; max-width:640px;">' +

                '</div>' +
              '</div>' +
              '<div class="admin-field">' +
                '<label>昵称</label>' +
                '<input id="avatar-nickname" type="text" class="input" value="' + esc(acc.nickname) + '" placeholder="输入昵称">' +
              '</div>' +
              '<div class="admin-field">' +
                '<label>上传照片</label>' +
                '<input id="avatar-file" type="file" accept="image/*" class="input" style="height:auto;padding:8px 10px;">' +
              '</div>' +
              '<button id="save-avatar" class="btn-primary">保存</button>' +
            '</div>';

          document.getElementById('save-avatar').addEventListener('click', function () {
            var fileInput = document.getElementById('avatar-file');
            var nickname = document.getElementById('avatar-nickname').value.trim();
            var file = fileInput.files[0];

            function doSave(dataUrl) {
              var updates = {};
              if (nickname) updates.nickname = nickname;
              if (dataUrl) updates.avatar = dataUrl;
              LoveAdmin.updateAccount(currentIdentity, updates);
              currentAccount = LoveAdmin.getCurrentAccount();
              LoveAdmin.toast('头像和昵称已保存');
              renderAvatars();
            }

            if (file) {
              LoveData.readLocalImage(file, function (err, dataUrl) {
                if (err) { LoveAdmin.toast(err.message); return; }
                // 裁剪为正方形
                var img = new Image();
                img.onload = function () {
                  var size = Math.min(img.width, img.height);
                  var sx = (img.width - size) / 2;
                  var sy = (img.height - size) / 2;
                  var canvas = document.createElement('canvas');
                  canvas.width = 200;
                  canvas.height = 200;
                  var ctx = canvas.getContext('2d');
                  ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200);
                  doSave(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.src = dataUrl;
              });
            } else {
              doSave(null);
            }
          });
        }

              html +=
                '<div class="admin-list-item">' +
                  '<img src="' + esc(item.cover) + '" class="admin-small-img" loading="lazy" onerror="this.style.display=\'none\'">' +
                  '<div style="flex:1; min-width:0;">' +
                    '<div style="display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;">' +
                      '<span class="admin-badge">' + esc(item.date) + '</span>' +
                      '<span class="admin-badge" style="background:var(--surface-2); color:var(--ink-2);">' + esc(item.tag) + '</span>' +
                      '<span class="body" style="font-weight:600;">' + esc(item.title) + '</span>' +
                    '</div>' +
                    '<p class="body" style="margin:0; color:var(--ink-2); word-break:break-word;">' + esc(item.text) + '</p>' +
                  '</div>' +
                  '<button class="btn-secondary" data-del-tl="' + esc(item.id) + '" style="padding:8px 12px; font-size:13px; flex-shrink:0;">' +
                    '<i data-lucide="trash-2" style="width:16px;height:16px;"></i>删除' +
                  '</button>' +
                '</div>';
            });
            html += '</div>';
          }
          content.innerHTML = html;

          var coverInput = document.getElementById('new-tl-cover');
          var coverFile = document.getElementById('new-tl-cover-file');
          var coverPreview = document.getElementById('new-tl-cover-preview');

          coverInput.addEventListener('input', function () {
            var val = this.value.trim();
            if (val) {
              coverPreview.style.display = 'block';
              coverPreview.src = val;
            } else {
              coverPreview.style.display = 'none';
            }
          });

          coverFile.addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) return;
            LoveData.readLocalImage(file, function (err, dataUrl) {
              if (err) { LoveAdmin.toast(err.message); return; }
              coverPreview.style.display = 'block';
              coverPreview.src = dataUrl;
              coverInput.value = dataUrl;
            });
          });

          document.getElementById('add-timeline').addEventListener('click', function () {
            var date = document.getElementById('new-tl-date').value.trim();
            var tag = document.getElementById('new-tl-tag').value.trim();
            var title = document.getElementById('new-tl-title').value.trim();
            var cover = document.getElementById('new-tl-cover').value.trim();
            var text = document.getElementById('new-tl-text').value.trim();
            if (!date || !title || !text) return;
            LoveData.addTimeline({ date: date, tag: tag, title: title, cover: cover, text: text });
            LoveAdmin.toast('点滴已添加');
            renderTimeline();
          });

          content.querySelectorAll('[data-del-tl]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              LoveData.deleteTimeline(this.dataset.delTl);
              LoveAdmin.toast('点滴已删除');
              renderTimeline();
            });
          });
        }

        function renderLetter() {
          var letter = LoveData.getLetter();
          content.innerHTML =
            '<h2 class="h2" style="margin:0 0 4px;">信件管理</h2>' +
            '<p class="caption" style="margin:0 0 24px;">编辑给嘉嘉小星星的信</p>' +
            '<div class="card" style="padding:24px;">' +
              '<div class="admin-field"><label>称呼</label><input id="letter-greeting" type="text" class="input" value="' + esc(letter.greeting) + '"></div>' +
              '<div class="admin-field"><label>落款</label><input id="letter-sign" type="text" class="input" value="' + esc(letter.signOff) + '"></div>' +
              '<div class="admin-field"><label>日期文字</label><input id="letter-date" type="text" class="input" value="' + esc(letter.dateText) + '"></div>' +
              '<div class="admin-field"><label>正文段落（每段一行）</label><textarea id="letter-paragraphs" class="input" style="height:auto; min-height:200px; padding:12px 14px;">' + esc((letter.paragraphs || []).join('\n')) + '</textarea></div>' +
              '<button id="save-letter" class="btn-primary">保存信件</button>' +
            '</div>';

          document.getElementById('save-letter').addEventListener('click', function () {
            confirmSave('确定保存信件内容吗？', function () {
              var updated = {
                greeting: document.getElementById('letter-greeting').value.trim(),
                signOff: document.getElementById('letter-sign').value.trim(),
                dateText: document.getElementById('letter-date').value.trim(),
                paragraphs: document.getElementById('letter-paragraphs').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
              };
              LoveData.saveLetter(updated);
              LoveAdmin.toast('信件已保存');
              renderLetter();
            });
          });
        }

        function renderBackup() {
          content.innerHTML =
            '<h2 class="h2" style="margin:0 0 4px;">备份与恢复</h2>' +
            '<p class="caption" style="margin:0 0 24px;">导出所有数据备份，或从备份文件恢复</p>' +
            '<div class="card" style="padding:24px; margin-bottom:24px;">' +
              '<h3 class="h3" style="margin:0 0 12px;">导出备份</h3>' +
              '<p class="body" style="margin:0 0 16px; color:var(--ink-2);">将当前所有数据（网站设置、留言、相册、清单、点滴、信件）导出为 JSON 备份文件。</p>' +
              '<button id="export-backup" class="btn-primary">' +
                '<i data-lucide="download" style="width:18px;height:18px;"></i>导出备份' +
              '</button>' +
            '</div>' +
            '<div class="card" style="padding:24px; margin-bottom:24px;">' +
              '<h3 class="h3" style="margin:0 0 12px;">恢复备份</h3>' +
              '<p class="body" style="margin:0 0 16px; color:var(--ink-2);">选择之前导出的 JSON 备份文件进行恢复。恢复将覆盖当前所有数据，请谨慎操作。</p>' +
              '<div class="admin-field">' +
                '<label>选择备份文件</label>' +
                '<input id="import-file" type="file" accept=".json" class="input" style="padding:10px 12px; height:auto;">' +
              '</div>' +
              '<button id="import-backup" class="btn-primary" style="background:var(--state-warning);">' +
                '<i data-lucide="upload" style="width:18px;height:18px;"></i>恢复备份' +
              '</button>' +
              '<p id="import-status" class="caption" style="margin:12px 0 0; display:none;"></p>' +
            '</div>' +
            '<div class="card" style="padding:24px;">' +
              '<h3 class="h3" style="margin:0 0 12px; color:var(--state-error);">重置数据</h3>' +
              '<p class="body" style="margin:0 0 16px; color:var(--ink-2);">清除所有数据并恢复为默认内容。此操作不可撤销，建议先导出备份。</p>' +
              '<button id="reset-data" class="btn-primary" style="background:var(--state-error);">' +
                '<i data-lucide="alert-triangle" style="width:18px;height:18px;"></i>重置所有数据' +
              '</button>' +
            '</div>';

          document.getElementById('export-backup').addEventListener('click', function () {
            var data = LoveData.exportAllData();
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'love-timer-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            LoveAdmin.toast('备份已导出');
          });

          var fileInput = document.getElementById('import-file');
          document.getElementById('import-backup').addEventListener('click', function () {
            var file = fileInput.files && fileInput.files[0];
            if (!file) {
              LoveAdmin.toast('请先选择备份文件');
              return;
            }
            confirmSave('恢复备份将覆盖当前所有数据，确定继续吗？', function () {
              var reader = new FileReader();
              reader.onload = function (e) {
                try {
                  var json = JSON.parse(e.target.result);
                  LoveData.importAllData(json);
                  var status = document.getElementById('import-status');
                  status.style.display = 'block';
                  status.style.color = 'var(--state-success)';
                  status.textContent = '备份恢复成功！页面将刷新以应用更改。';
                  LoveAdmin.toast('备份恢复成功');
                  setTimeout(function () { window.location.reload(); }, 1500);
                } catch (err) {
                  var status = document.getElementById('import-status');
                  status.style.display = 'block';
                  status.style.color = 'var(--state-error)';
                  status.textContent = '恢复失败：' + err.message;
                }
              };
              reader.readAsText(file);
            });
          });

          document.getElementById('reset-data').addEventListener('click', function () {
            confirmSave('⚠️ 此操作将清除所有数据并恢复默认内容，无法撤销！确定继续吗？', function () {
              confirmSave('再次确认：真的要重置所有数据吗？', function () {
                LoveData.resetAll();
                LoveAdmin.toast('数据已重置，页面将刷新');
                setTimeout(function () { window.location.reload(); }, 1500);
              });
            });
          });
        }

        // 退出登录
        document.getElementById('admin-logout').addEventListener('click', function () {
          LoveAdmin.logout();
          window.location.href = 'admin-login.html';
        });

        // 账号切换下拉菜单
        (function () {
          var badge = document.getElementById('admin-account-badge');
          if (!badge) return;

          // 设置点击切换
          badge.style.cursor = 'pointer';
          badge.style.position = 'relative';

          // 创建下拉菜单 DOM
          var dropdown = document.createElement('div');
          dropdown.id = 'account-dropdown';
          dropdown.style.cssText = 'display:none;position:absolute;top:100%;right:0;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 4px 20px rgba(0,0,0,0.08);z-index:100;min-width:200px;overflow:hidden;';
          badge.parentNode.style.position = 'relative';
          badge.parentNode.appendChild(dropdown);

          var accounts = [
            { id: 'left', nickname: '嘉嘉小星星', identity: 'left' },
            { id: 'right', nickname: '陈卓卓', identity: 'right' }
          ];

          function renderDropdown() {
            dropdown.innerHTML = accounts.map(function (a) {
              var isActive = currentIdentity === a.identity;
              var accData = LoveAdmin.getAccount(a.identity);
              var avatarHtml = '';
              if (accData && accData.avatar) {
                avatarHtml = '<div style="width:28px;height:28px;border-radius:50%;overflow:hidden;border:1px solid var(--brand-200);flex-shrink:0;"><img src="' + esc(accData.avatar) + '" style="width:100%;height:100%;object-fit:cover;"></div>';
              } else {
                avatarHtml = '<div style="width:28px;height:28px;border-radius:50%;background:var(--brand-100);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--brand);font-weight:600;font-size:14px;">' + esc(a.nickname.charAt(0)) + '</div>';
              }
              return '<div class="account-dropdown-item" data-switch="' + esc(a.identity) + '" style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;' + (isActive ? 'background:var(--brand-100);font-weight:600;' : '') + '">' +
                avatarHtml +
                '<span style="font-size:14px;color:var(--ink);">' + esc(a.nickname) + '</span>' +
                (isActive ? '<span style="margin-left:auto;font-size:11px;color:var(--brand);">当前</span>' : '') +
              '</div>';
            }).join('');
          }

          renderDropdown();

          badge.addEventListener('click', function (e) {
            e.stopPropagation();
            var isOpen = dropdown.style.display === 'block';
            dropdown.style.display = isOpen ? 'none' : 'block';
            if (!isOpen) renderDropdown();
          });

          dropdown.addEventListener('click', function (e) {
            var item = e.target.closest('[data-switch]');
            if (!item) return;
            var targetIdentity = item.dataset.switch;
            if (targetIdentity === currentIdentity) {
              dropdown.style.display = 'none';
              return;
            }
            LoveAdmin.switchAccount(targetIdentity);
            window.location.reload();
          });

          document.addEventListener('click', function () {
            dropdown.style.display = 'none';
          });
        })();

        // 显示当前账户信息
        (function () {
          var badge = document.getElementById('admin-account-badge');
          if (!badge || !currentAccount) return;
          var html = '';
          if (currentAccount.avatar) {
            html += '<div style="width:20px;height:20px;border-radius:50%;overflow:hidden;border:1px solid var(--brand-200);flex-shrink:0;"><img src="' + esc(currentAccount.avatar) + '" style="width:100%;height:100%;object-fit:cover;"></div>';
          } else {
            html += '<i data-lucide="shield-check" style="width:14px;height:14px;"></i>';
          }
          html += '<span>' + esc(currentAccount.nickname) + '</span>';
          html += '<i data-lucide="chevron-down" style="width:12px;height:12px;margin-left:2px;opacity:0.5;"></i>';
          badge.innerHTML = html;
          if (window.lucide) lucide.createIcons();
        })();

        buildMenu();
        renderTab('site');

        LoveData.applySiteText(document);
        lucide.createIcons();
      })();

</script>
</body>
</html>
