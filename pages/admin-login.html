:root {
  --love-background: #fff5f7;
  --love-foreground: #4a3f41;

  --love-popover: #ffffff;

  --love-primary: #f47298;
  --love-primary-foreground: #ffffff;
  --love-muted: #f9e8ed;
  --love-muted-foreground: #8a7b7f;
  --love-border: #f3d8e0;
  --love-input: #ffffff;
  --love-ring: #f47298;
  --love-radius-small: 4px;
  --love-radius-medium: 8px;
  --love-radius-large: 16px;

  --bg: #fff5f7;
  --surface: #ffffff;
  --surface-2: #fef0f3;
  --ink: #4a3f41;
  --ink-2: #6d5e62;
  --ink-3: #9e8f94;
  --line: #f3d8e0;
  --brand: #f47298;
  --brand-ink: #ffffff;
  --brand-100: #ffe4eb;
  --brand-200: #fec6d6;
  --brand-300: #fda1bf;
  --brand-400: #f97da7;
  --brand-500: #f47298;
  --brand-600: #d84e7a;
  --brand-700: #b53761;
  --state-success: #34c759;
  --state-warning: #ff9500;
  --state-error: #ff3b30;
  --state-info: #5ac8fa;

  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 9999px;
  --shadow-1: 0 1px 2px rgba(74, 63, 65, 0.05), 0 1px 1px rgba(74, 63, 65, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(74, 63, 65, 0.15);
  --shadow-3: 0 24px 60px -20px rgba(74, 63, 65, 0.22);

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;
  --s-9: 120px;

  --font-display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

.dark {
  --love-background: #181214;
  --love-foreground: #f4e8ea;
  --love-card: #221c1e;
  --love-card-foreground: #f4e8ea;
  --love-popover: #221c1e;
  --love-popover-foreground: #f4e8ea;
  --love-primary: #f47298;
  --love-primary-foreground: #ffffff;
  --love-muted: #2d2527;
  --love-muted-foreground: #b5a7ab;
  --love-border: #3b3134;
  --love-input: #221c1e;
  --love-ring: #f47298;

  --bg: #181214;
  --surface: #221c1e;
  --surface-2: #2d2527;
  --ink: #f4e8ea;
  --ink-2: #d6c9cc;
  --ink-3: #a89da0;
  --line: #3b3134;
  --brand: #f47298;
  --brand-ink: #ffffff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: var(--font-body);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.h1 {
  font-family: var(--font-display);
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-wrap: balance;
  word-break: keep-all;
}

.h2 {
  font-family: var(--font-display);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
  word-break: keep-all;
}

.h3 {
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
  word-break: keep-all;
}

.body {
  font-size: 15px;
  line-height: 1.6;
}

.caption {
  font-size: 13px;
  line-height: 1.5;
  letter-spacing: 0.005em;
  color: var(--ink-3);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background-color: var(--brand);
  color: var(--brand-ink);
  border: none;
  border-radius: var(--r-md);
  padding: 12px 20px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: background-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.btn-primary:hover {
  background-color: var(--brand-600);
  transform: translateY(-1px);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background-color: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 20px;
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
  transition: border-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.btn-secondary:hover {
  border-color: var(--brand);
  background-color: var(--brand-100);
}

/* 音乐播放按钮：更精致的细边框 + 轻阴影 */
#music-toggle {
  border: 1px solid rgba(244, 114, 152, 0.28);
  background: rgba(255, 255, 255, 0.55);
  box-shadow: 0 1px 2px rgba(244, 114, 152, 0.06), 0 2px 8px rgba(244, 114, 152, 0.05);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: border-color 200ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 200ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

#music-toggle:hover {
  border-color: rgba(244, 114, 152, 0.5);
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 2px 4px rgba(244, 114, 152, 0.1), 0 6px 16px rgba(244, 114, 152, 0.08);
}

.dark #music-toggle {
  background: rgba(34, 28, 30, 0.55);
  border-color: rgba(244, 114, 152, 0.22);
}

.dark #music-toggle:hover {
  background: rgba(34, 28, 30, 0.8);
  border-color: rgba(244, 114, 152, 0.42);
}

.input {
  width: 100%;
  height: 48px;
  padding: 0 16px;
  background-color: var(--love-input);
  color: var(--love-foreground);
  border: 1px solid var(--love-border);
  border-radius: var(--r-md);
  font-size: 15px;
  outline: none;
  transition: border-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 2px var(--brand-200);
}

.input::placeholder {
  color: var(--ink-3);
}

.card {
  background-color: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
}

.nav-link {

  text-decoration: none;
  font-weight: 500;

    background-attachment: scroll !important;
  }
}

    <script>
      (function () {
        var isApiMode = window.LoveData && window.LoveData.useApi;

        function initLoginPage() {
          if (window.LoveAdmin && LoveAdmin.isLoggedIn()) {
            window.location.href = preserveApiRedirect('admin-dashboard.html');
            return;
          }

          var form = document.getElementById('login-form');
          var input = document.getElementById('password');
          var error = document.getElementById('error');
          var submitBtn = document.getElementById('login-submit');
          var leftLabel = document.getElementById('login-left-label');
          var rightLabel = document.getElementById('login-right-label');
          var leftRadio = leftLabel.querySelector('input[type="radio"]');
          var rightRadio = rightLabel.querySelector('input[type="radio"]');

          /* 加载头像和昵称 */
          var accounts = LoveAdmin.getAccounts();
          var leftImg = document.getElementById('login-left-avatar').querySelector('img');
          var rightImg = document.getElementById('login-right-avatar').querySelector('img');
          leftLabel.querySelector('span').textContent = accounts.left.nickname;
          rightLabel.querySelector('span').textContent = accounts.right.nickname;
          if (accounts.left.avatar && leftImg) { leftImg.src = resolveMediaUrl(accounts.left.avatar); leftImg.style.display = ''; }
          if (accounts.right.avatar && rightImg) { rightImg.src = resolveMediaUrl(accounts.right.avatar); rightImg.style.display = ''; }

          function selectLoginSide(val) {
            var isLeft = val === 'left';
            leftLabel.style.border = isLeft ? '2px solid var(--brand)' : '2px solid var(--line)';
            leftLabel.style.background = isLeft ? 'var(--brand-100)' : 'transparent';
            leftLabel.querySelector('span').style.color = isLeft ? 'var(--brand)' : 'var(--ink-2)';
            rightLabel.style.border = isLeft ? '2px solid var(--line)' : '2px solid var(--brand)';
            rightLabel.style.background = isLeft ? 'transparent' : 'var(--brand-100)';
            rightLabel.querySelector('span').style.color = isLeft ? 'var(--ink-2)' : 'var(--brand)';
          }

          leftLabel.addEventListener('click', function () { leftRadio.checked = true; selectLoginSide('left'); });
          rightLabel.addEventListener('click', function () { rightRadio.checked = true; selectLoginSide('right'); });

          form.addEventListener('submit', function (e) {
            e.preventDefault();
            error.style.display = 'none';
            var pwd = input.value.trim();
            if (!pwd) return;

            var side = leftRadio.checked ? 'left' : 'right';

            // API 模式：异步登录
            if (isApiMode && window.LoveAdmin.loginAsync) {
              if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader" style="width:18px;height:18px;"></i> 登录中...';
                if (window.lucide) window.lucide.createIcons();
              }
              window.LoveAdmin.loginAsync(side, pwd).then(function (success) {
                if (success) {
                  window.location.href = preserveApiRedirect('admin-dashboard.html');
                } else {
                  error.textContent = '密码不正确';
                  error.style.display = 'block';
                  input.value = '';
                  input.focus();
                  if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i data-lucide="log-in" style="width:18px;height:18px;"></i> 登录';
                  }
                  if (window.lucide) window.lucide.createIcons();
                }
              });
            } else {
              // localStorage 模式：同步登录
              if (window.LoveAdmin && LoveAdmin.login(side, pwd)) {
                window.location.href = preserveApiRedirect('admin-dashboard.html');
              } else {
                error.textContent = '密码不正确';
                error.style.display = 'block';
                input.value = '';
                input.focus();
              }
            }
          });

          if (window.lucide) window.lucide.createIcons();
        }

        // 等待 LoveAdmin.ready() 后再判断登录状态
        if (window.LoveAdmin && window.LoveAdmin.ready) {
          LoveAdmin.ready().then(initLoginPage).catch(function (err) {
            console.error('[Login] 初始化失败:', err);
            initLoginPage(); // 降级：即使失败也显示登录页面
          });
        } else {
          initLoginPage();
        }
      })();
    </script>
    <script>if(window.LoveData&&window.LoveData.ready){LoveData.ready().then(function(){LoveData.applySiteText(document)})}else{LoveData.applySiteText(document)}</script>
</body>
</html>
