<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>页面暂未开放 - 我们的小宇宙</title>
  <style>
    :root {
      --bg: #fff5f7;
      --surface: #ffffff;
      --ink: #4a3f41;
      --ink-2: #6d5e62;
      --line: #f3d8e0;
      --brand: #f47298;
      --brand-ink: #ffffff;
      --r-md: 8px;
      --shadow-2: 0 8px 24px -8px rgba(74, 63, 65, 0.15);
      --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
    }
    main {
      width: min(100%, 480px);
      padding: 40px 28px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      text-align: center;
      box-shadow: var(--shadow-2);
    }
    h1 {
      margin: 0 0 12px;
      color: var(--brand);
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 24px;
      color: var(--ink-2);
      font-size: 15px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: var(--r-md);
      background: var(--brand);
      color: var(--brand-ink);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>页面暂未开放</h1>
    <p>可以先回到首页继续浏览我们的照片和点滴。</p>
    <a href="home-20260808h.html">返回首页</a>
  </main>
</body>
</html>
