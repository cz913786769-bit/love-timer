@import "tailwindcss";

:root {
  --love-background: #fff5f7;
  --love-foreground: #4a3f41;
  --love-card: #ffffff;
  --love-card-foreground: #4a3f41;
  --love-popover: #ffffff;
  --love-popover-foreground: #4a3f41;
  --love-primary: #f47298;
  --love-primary-foreground: #ffffff;
  --love-muted: #f9e8ed;
  --love-muted-foreground: #8a7b7f;
  --love-border: #f3d8e0;
  --love-input: #ffffff;
  --love-ring: #f47298;
  --love-radius-small: 4px;
  --love-radius-medium: 8px;
  --love-radius-large: 16px;

  --bg: #fff5f7;
  --surface: #ffffff;
  --surface-2: #fef0f3;
  --ink: #4a3f41;
  --ink-2: #6d5e62;
  --ink-3: #9e8f94;
  --line: #f3d8e0;
  --brand: #f47298;
  --brand-ink: #ffffff;
  --brand-100: #ffe4eb;
  --brand-200: #fec6d6;
  --brand-300: #fda1bf;
  --brand-400: #f97da7;
  --brand-500: #f47298;
  --brand-600: #d84e7a;
  --brand-700: #b53761;
  --state-success: #34c759;
  --state-warning: #ff9500;
  --state-error: #ff3b30;
  --state-info: #5ac8fa;

  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 9999px;
  --shadow-1: 0 1px 2px rgba(74, 63, 65, 0.05), 0 1px 1px rgba(74, 63, 65, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(74, 63, 65, 0.15);
  --shadow-3: 0 24px 60px -20px rgba(74, 63, 65, 0.22);

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;
  --s-9: 120px;

  --font-display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

.dark {
  --love-background: #181214;
  --love-foreground: #f4e8ea;
  --love-card: #221c1e;
  --love-card-foreground: #f4e8ea;
  --love-popover: #221c1e;
  --love-popover-foreground: #f4e8ea;
  --love-primary: #f47298;
  --love-primary-foreground: #ffffff;
  --love-muted: #2d2527;
  --love-muted-foreground: #b5a7ab;
  --love-border: #3b3134;
  --love-input: #221c1e;
  --love-ring: #f47298;

  --bg: #181214;
  --surface: #221c1e;
  --surface-2: #2d2527;
  --ink: #f4e8ea;
  --ink-2: #d6c9cc;
  --ink-3: #a89da0;
  --line: #3b3134;
  --brand: #f47298;
  --brand-ink: #ffffff;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-body);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.display {
  font-family: var(--font-display);
  font-size: clamp(40px, 6vw, 88px);
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
  text-wrap: balance;
  word-break: keep-all;
}
.h1 {
  font-family: var(--font-display);
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-wrap: balance;
  word-break: keep-all;
}
.h2 {
  font-family: var(--font-display);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
  word-break: keep-all;
}
.h3 {
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
  word-break: keep-all;
}
.body-l { font-size: 18px; line-height: 1.55; }
.body { font-size: 15px; line-height: 1.6; }
.caption {
  font-size: 13px;
  line-height: 1.5;
  letter-spacing: 0.005em;
  color: var(--ink-3);
}
.mono {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background-color: var(--brand);
  color: var(--brand-ink);
  border: none;
  border-radius: var(--r-md);
  padding: 12px 20px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: background-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.btn-primary:hover { background-color: var(--brand-600); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background-color: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 20px;
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
  transition: border-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.btn-secondary:hover { border-color: var(--brand); background-color: var(--brand-100); }

/* 音乐播放按钮：更精致的细边框 + 轻阴影 */
#music-toggle {
  border: 1px solid rgba(244, 114, 152, 0.28);
  background: rgba(255, 255, 255, 0.55);
  box-shadow: 0 1px 2px rgba(244, 114, 152, 0.06), 0 2px 8px rgba(244, 114, 152, 0.05);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: border-color 200ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 200ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

#music-toggle:hover {
  border-color: rgba(244, 114, 152, 0.5);
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 2px 4px rgba(244, 114, 152, 0.1), 0 6px 16px rgba(244, 114, 152, 0.08);
}

.dark #music-toggle {
  background: rgba(34, 28, 30, 0.55);
  border-color: rgba(244, 114, 152, 0.22);
}

.dark #music-toggle:hover {
  background: rgba(34, 28, 30, 0.8);
  border-color: rgba(244, 114, 152, 0.42);
}

.btn-text {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  color: var(--brand);
  border: none;
  padding: 8px 0;
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.input {
  width: 100%;
  height: 48px;
  padding: 0 16px;
  background-color: var(--love-input);
  color: var(--love-foreground);
  border: 1px solid var(--love-border);
  border-radius: var(--r-md);
  font-size: 15px;
  outline: none;
  transition: border-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-200); }
.input::placeholder { color: var(--ink-3); }
.card {
  background-color: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
}
.tag {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  background-color: var(--surface-2);
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 500;
}
.nav-link {
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 500;
  transition: color 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.nav-link:hover, .nav-link[data-active="true"] { color: var(--brand); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 992px) {
  header > div {
    padding: 0 16px;
    gap: 10px;
  }
  header > div > a:first-of-type .logo-text {
    display: none;
  }
  header > div > nav {
    justify-content: flex-start;
    overflow-x: auto;
    white-space: nowrap;
    flex-shrink: 1;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  header > div > nav::-webkit-scrollbar {
    display: none;
  }
  header > div > nav a {
    white-space: nowrap;
  }
  header > div > button#music-toggle > span#music-label {
    display: none;
  }
}

@media (max-width: 768px) {
  header > div {
    padding: 0 12px;
    gap: 8px;
  }

  /* 性能优化：移动端降低毛玻璃模糊半径，减少 GPU 开销 */
  header,
  .glass,
  .album-group-header {
    backdrop-filter: blur(6px) !important;
    -webkit-backdrop-filter: blur(6px) !important;
  }

  /* 性能优化：移动端禁用 fixed 背景，避免滚动时重绘卡顿 */
  #hero-section {
    background-attachment: scroll !important;
  }
}

    <script>
      (function () {
        var listEl = document.getElementById('love-timeline-list');
        var emptyEl = document.getElementById('love-timeline-empty');
        var addBtn = document.getElementById('love-add-timeline-btn');
        var form = document.getElementById('love-timeline-form');
        var cancelBtn = document.getElementById('love-timeline-form-cancel');

        function escapeHtml(str) {
          if (str == null) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function fmtDate(iso) {
          try { return new Date(iso).toLocaleString('zh-CN'); } catch (e) { return iso; }
        }

        function creatorBadge(item) {
          if (!item.createdBy) return '';
          var acc = LoveAdmin.getAccount(item.createdBy);
          if (!acc) return '';
          var avatarHtml = '';
          if (acc.avatar) {
            avatarHtml = '<div style="width:16px;height:16px;border-radius:50%;overflow:hidden;border:1px solid var(--brand-200);flex-shrink:0;"><img src="' + escapeHtml(acc.avatar) + '" style="width:100%;height:100%;object-fit:cover;"></div>';
          }
          var timeStr = item.createdAt ? ' · ' + fmtDate(item.createdAt) : '';
          return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);padding:2px 8px;background:var(--surface-2);border-radius:var(--r-pill);">' + avatarHtml + escapeHtml(acc.nickname) + timeStr + '</span>';
        }

        function renderTimeline() {
          var items = LoveData.getTimeline();
          items.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
          listEl.innerHTML = '';
          if (!items || items.length === 0) {
            listEl.style.display = 'none';
            emptyEl.style.display = 'block';
            return;
          }
          listEl.style.display = '';
          emptyEl.style.display = 'none';

          items.forEach(function (item) {
            var coverHtml = item.cover
              ? '<div class="relative">' +
                  '<img src="' + escapeHtml(item.cover) + '" alt="' + escapeHtml(item.title) + '" class="w-full h-48 md:h-full object-cover">' +
                  '<div class="absolute bottom-0 left-0 right-0 px-3 py-2" style="background: linear-gradient(transparent, rgba(24,18,20,0.55));">' +
                    '<span class="text-sm font-medium" style="color: var(--brand-ink);">' + escapeHtml(item.title) + '</span>' +
                  '</div>' +
                '</div>'
              : '<div class="w-full h-48 md:h-full flex items-center justify-center" style="background:var(--surface-2);color:var(--ink-3);"><span>无封面</span></div>';
            var html =
              '<div class="timeline-item relative">' +
                '<div class="timeline-dot absolute" style="left: -40px; top: 24px;"></div>' +
                '<div class="timeline-card card overflow-hidden relative">' +
                  '<button type="button" class="love-admin-only timeline-delete-btn" data-id="' + escapeHtml(item.id) + '" style="position:absolute;top:10px;right:10px;z-index:10;padding:6px 10px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--state-error);font-size:13px;font-weight:500;cursor:pointer;">' +
                    '删除' +
                  '</button>' +
                  '<div class="grid grid-cols-1 md:grid-cols-3">' +
                    coverHtml +
                    '<div class="p-5 md:col-span-2">' +
                      '<div class="flex items-center gap-3 mb-3">' +
                        '<span class="tag">' + escapeHtml(item.date) + '</span>' +
                        '<span class="tag" style="background: var(--brand-100); color: var(--brand-700);">' + escapeHtml(item.tag) + '</span>' +
                      '</div>' +
                      '<h2 class="h3 mb-2">' + escapeHtml(item.title) + '</h2>' +
                      creatorBadge(item) +
                      '<p class="body" style="color: var(--ink-2);">' + escapeHtml(item.text) + '</p>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
              '</div>';
            listEl.insertAdjacentHTML('beforeend', html);
          });

          listEl.querySelectorAll('.timeline-delete-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var id = btn.getAttribute('data-id');
              if (confirm('确定要删除这条点滴吗？')) {
                LoveData.deleteTimeline(id);
                renderTimeline();
                LoveAdmin.toast('已删除点滴');
              }
            });
          });
        }

        if (addBtn) {
          addBtn.addEventListener('click', function () {
            form.classList.toggle('active');
            if (form.classList.contains('active')) {
              form.querySelector('#lt-date').focus();
            }
          });
        }

        if (cancelBtn) {
          cancelBtn.addEventListener('click', function () {
            form.classList.remove('active');
            form.reset();
          });
        }

        if (form) {
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            var data = {
              date: form.querySelector('#lt-date').value,
              tag: form.querySelector('#lt-tag').value.trim(),
              title: form.querySelector('#lt-title').value.trim(),
              cover: form.querySelector('#lt-cover').value.trim(),
              text: form.querySelector('#lt-text').value.trim()
            };
            if (!data.date || !data.tag || !data.title || !data.text) return;
            LoveData.addTimeline(data);
            form.reset();
            form.classList.remove('active');
            renderTimeline();
            LoveAdmin.toast('已添加点滴');
          });
        }

        renderTimeline();
      })();
    </script>
    <script>lucide.createIcons();</script>
    <script>LoveData.applySiteText(document);</script>
<script>document.addEventListener('DOMContentLoaded',function(){var c=LoveData.getCover();if(c){var h=document.getElementById('hero-section');if(h)h.style.background='linear-gradient(rgba(255,245,247,0.15), rgba(255,245,247,0.15)), url('+c+') center/cover no-repeat fixed';}});</script>
    <script src="../assets/js/cover-contrast.js?v=20260807d"></script>
</body>
