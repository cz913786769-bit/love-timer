* { box-sizing: border-box; }

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background-color: var(--brand);
  color: var(--brand-ink);

  border-radius: var(--r-md);
  padding: 12px 20px;

  font-size: 15px;

.btn-primary:hover { background-color: var(--brand-600); transform: translateY(-1px); }

.btn-secondary {

  justify-content: center;
  gap: 8px;

  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--r-md);

  font-size: 15px;

/* 音乐播放按钮：更精致的细边框 + 轻阴影 */
#music-toggle {
  border: 1px solid rgba(244, 114, 152, 0.28);
  background: rgba(255, 255, 255, 0.55);
  box-shadow: 0 1px 2px rgba(244, 114, 152, 0.06), 0 2px 8px rgba(244, 114, 152, 0.05);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: border-color 200ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 200ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

#music-toggle:hover {
  border-color: rgba(244, 114, 152, 0.5);
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 2px 4px rgba(244, 114, 152, 0.1), 0 6px 16px rgba(244, 114, 152, 0.08);
}

.dark #music-toggle {
  background: rgba(34, 28, 30, 0.55);
  border-color: rgba(244, 114, 152, 0.22);
}

.dark #music-toggle:hover {
  background: rgba(34, 28, 30, 0.8);
  border-color: rgba(244, 114, 152, 0.42);
}

  align-items: center;
  gap: 6px;
  background: transparent;
  color: var(--brand);

  text-decoration: underline;
  text-underline-offset: 4px;
}
.input {

  border: 1px solid var(--love-border);
  border-radius: var(--r-md);
  font-size: 15px;

  transition: border-color 150ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-200); }
.input::placeholder { color: var(--ink-3); }
.card {

  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
}
.tag {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  background-color: var(--surface-2);
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 500;
}
.nav-link {
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 500;
  transition: color 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.nav-link:hover, .nav-link[data-active="true"] { color: var(--brand); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 992px) {
  header > div {
    padding: 0 16px;
    gap: 10px;
  }
  header > div > a:first-of-type .logo-text {
    display: none;
  }
  header > div > nav {
    justify-content: flex-start;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    flex-shrink: 1;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  header > div > nav::-webkit-scrollbar {
    display: none;
  }
  header > div > nav a {
    white-space: nowrap;
  }
  header > div > button#music-toggle > span#music-label {
    display: none;
  }
}

@media (max-width: 768px) {
  header > div {
    padding: 0 12px;
    gap: 8px;
  }

  /* 性能优化：移动端降低毛玻璃模糊半径，减少 GPU 开销 */
  header,
  .glass,
  .album-group-header {
    backdrop-filter: blur(6px) !important;
    -webkit-backdrop-filter: blur(6px) !important;
  }

  /* 性能优化：移动端禁用 fixed 背景，避免滚动时重绘卡顿 */
  #hero-section {
    background-attachment: scroll !important;
  }
}

        background: rgba(255,255,255,0.12);
        z-index: 2;
      }
      html, body { overscroll-behavior-y: contain; }
      .page-enter, .reveal {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1);
      }

      .love-admin-form.album-form.active { display: flex !important; flex-direction: column; }

</head>

    <script>
      (function () {
        var lightbox = document.getElementById('lightbox');
        var lightboxImg = document.getElementById('lightbox-img');
        var lightboxCaption = document.getElementById('lightbox-caption');
        var lightboxClose = document.getElementById('lightbox-close');
        var albumContainer = document.getElementById('album-container');
        var addGroupToggle = document.getElementById('add-group-toggle');
        var addGroupForm = document.getElementById('add-group-form');
        var cancelAddGroup = document.getElementById('cancel-add-group');
        var savedScrollY = 0;
        var lightboxPhotos = [];
        var currentPhotoIndex = -1;
        var lightboxPrev = document.getElementById('lightbox-prev');
        var lightboxNext = document.getElementById('lightbox-next');
        var lightboxSpinner = document.getElementById('lightbox-spinner');
        var lightboxCounter = document.getElementById('lightbox-counter');
        var touchStartX = 0;
        var touchStartY = 0;
        var touchStartTime = 0;

        function escapeHtml(str) {
          return String(str || '').replace(/[&<>"']/g, function (m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
          });
        }

        function creatorBadge(group) {
          if (!group.createdBy) return '';
          var acc = window.LoveAdmin.getAccount(group.createdBy);
          if (!acc) return '';
          var avatarHtml = '';
          if (acc.avatar) {
            avatarHtml = '<div style="width:16px;height:16px;border-radius:50%;overflow:hidden;border:1px solid var(--brand-200);flex-shrink:0;"><img src="' + escapeHtml(resolveMediaUrl(acc.avatar)) + '" style="width:100%;height:100%;object-fit:cover;"></div>';
          }
          var timeStr = group.createdAt ? ' · ' + new Date(group.createdAt).toLocaleString('zh-CN') : '';
          return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);padding:2px 8px;background:var(--surface-2);border-radius:var(--r-pill);">' + avatarHtml + escapeHtml(acc.nickname) + timeStr + '</span>';
        }

        function getAlbumThumbSrc(src) {
          if (!src || src.indexOf('data:') === 0) return src || '';
          return src.replace(/\/([^\/]+)\.(?:jpe?g|png|webp)(?:\?.*)?$/i, function (match, name) {
            return '/thumbs/' + name + '.webp';
          });
        }

        function closeLightbox() {
          lightbox.classList.remove('active');
          lightboxImg.classList.remove('loaded');
          lightboxImg.src = '';
          lightboxPhotos = [];
          currentPhotoIndex = -1;
          document.body.style.overflow = '';
          var targetY = savedScrollY;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.documentElement.style.scrollBehavior = 'auto';
              window.scrollTo(0, targetY);
              requestAnimationFrame(function () {
                document.documentElement.style.scrollBehavior = '';
              });
            });
          });
        }

        function renderAlbum() {
          var album = window.LoveData.getAlbum();
          albumContainer.innerHTML = album.map(function (group) {
            return '<div class="album-group love-admin-row reveal" data-group-id="' + escapeHtml(group.id) + '">' +
              '<div class="album-group-header">' +
                '<div class="flex items-center gap-3">' +
                  '<span class="tag">' + escapeHtml(group.date) + '</span>' +
                  '<h2 class="h3" style="color: var(--ink);">' + escapeHtml(group.title) + '</h2>' +
                  creatorBadge(group) +
                '</div>' +
                '<div class="love-admin-actions album-group-actions">' +
                  '<button type="button" class="love-admin-btn toggle-add-photo" data-group-id="' + escapeHtml(group.id) + '">添加照片</button>' +
                  '<button type="button" class="love-admin-btn danger delete-group" data-group-id="' + escapeHtml(group.id) + '">删除分组</button>' +
                '</div>' +
              '</div>' +
              '<div class="love-admin-only block" style="margin-bottom: 12px;">' +
                '<form class="love-admin-form album-form add-photo-form" data-group-id="' + escapeHtml(group.id) + '">' +
                  '<div class="field">' +
                    '<label>选择照片</label>' +
                    '<input type="file" class="photo-file" accept="image/*" required style="display:none;">' +
                    '<button type="button" class="love-admin-btn photo-select-btn">从相册/文件选择</button>' +
                    '<div class="photo-preview" style="margin-top:10px;display:none;max-width:200px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);">' +
                      '<img src="" alt="预览" style="width:100%;height:auto;display:block;">' +
                    '</div>' +
                  '</div>' +
                  '<div class="field">' +
                    '<label>说明文字</label>' +
                    '<input type="text" class="photo-caption" placeholder="照片说明">' +
                  '</div>' +
                  '<div class="actions">' +
                    '<button type="submit" class="love-admin-btn">添加</button>' +
                    '<button type="button" class="love-admin-btn cancel-add-photo">取消</button>' +
                  '</div>' +
                '</form>' +
              '</div>' +
              '<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">' +
                group.photos.map(function (photo) {
                    var isDataUrl = photo.src && photo.src.indexOf('data:') === 0;
                    var resolvedSrc = resolveMediaUrl(photo.src);
                    var escapedSrc = escapeHtml(resolvedSrc);
                    var escapedCaption = escapeHtml(photo.caption || '');
                    var mediaHtml;
                    var onloadAttr = 'onload="this.classList.add(\'loaded\'); var s=this.closest(\'.album-thumb\').querySelector(\'.thumb-skeleton\'); if(s) s.style.display=\'none\';"';
                    var thumbSrc = getAlbumThumbSrc(resolvedSrc);
                    var escapedThumbSrc = escapeHtml(thumbSrc);
                    if (isDataUrl) {
                      mediaHtml = '<img src="' + escapedSrc + '" alt="' + escapedCaption + '" data-caption="' + escapedCaption + '" data-full-src="' + escapedSrc + '" loading="lazy" decoding="async" fetchpriority="low" width="400" height="300" style="width:100%;height:100%;object-fit:cover;" ' + onloadAttr + '>';
                    } else {
                      mediaHtml = '<img src="' + escapedThumbSrc + '" alt="' + escapedCaption + '" data-caption="' + escapedCaption + '" data-full-src="' + escapedSrc + '" loading="lazy" decoding="async" fetchpriority="low" width="400" height="300" style="width:100%;height:100%;object-fit:cover;" ' + onloadAttr + '>';
                    }
                    return '<div class="album-thumb love-admin-row" data-group-id="' + escapeHtml(group.id) + '" data-src="' + escapedSrc + '">' +
                      '<div class="aspect-[4/3] overflow-hidden" style="border-radius: var(--r-md) var(--r-md) 0 0; position:relative;">' +
                        '<div class="thumb-skeleton"></div>' +
                        mediaHtml +
                      '</div>' +
                      '<div class="album-thumb-caption">' + escapedCaption + '</div>' +
                      '<button type="button" class="love-admin-actions love-admin-btn danger delete-photo" style="position:absolute;top:6px;right:6px;z-index:2;" data-group-id="' + escapeHtml(group.id) + '" data-src="' + escapedSrc + '">删除</button>' +
                    '</div>';
                  }).join('') +
              '</div>' +
            '</div>';
          }).join('');

          bindAdminActions();
          revealDynamicContent();
        }

        function revealDynamicContent() {
          if (window.LoveInteractions && window.LoveInteractions.reveal) {
            window.LoveInteractions.reveal(albumContainer);
            return;
          }
          albumContainer.querySelectorAll('.reveal:not(.is-visible)').forEach(function (el) {
            el.classList.add('is-visible');
          });
        }

        function bindAdminActions() {
          albumContainer.querySelectorAll('.toggle-add-photo').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var groupId = btn.dataset.groupId;
              var form = albumContainer.querySelector('.add-photo-form[data-group-id="' + groupId + '"]');
              if (form) form.classList.toggle('active');
            });
          });

          albumContainer.querySelectorAll('.cancel-add-photo').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var form = btn.closest('.add-photo-form');
              if (!form) return;
              form.classList.remove('active');
              var fileInput = form.querySelector('.photo-file');
              var preview = form.querySelector('.photo-preview');
              var img = preview ? preview.querySelector('img') : null;
              var captionInput = form.querySelector('.photo-caption');
              if (fileInput) fileInput.value = '';
              if (img) {
                if (img._objectUrl) URL.revokeObjectURL(img._objectUrl);
                img.src = '';
                img._objectUrl = null;
              }
              if (preview) preview.style.display = 'none';
              if (captionInput) captionInput.value = '';
            });
          });

          albumContainer.querySelectorAll('.photo-select-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var form = btn.closest('.add-photo-form');
              var input = form ? form.querySelector('.photo-file') : null;
              if (input) input.click();
            });
          });

          albumContainer.querySelectorAll('.photo-file').forEach(function (input) {
            input.addEventListener('change', function () {
              var form = input.closest('.add-photo-form');
              var preview = form ? form.querySelector('.photo-preview') : null;
              var img = preview ? preview.querySelector('img') : null;
              var file = input.files[0];
              if (!preview || !img) return;
              if (!file) {
                preview.style.display = 'none';
                if (img._objectUrl) URL.revokeObjectURL(img._objectUrl);
                img.src = '';
                img._objectUrl = null;
                return;
              }
              if (img._objectUrl) URL.revokeObjectURL(img._objectUrl);
              img._objectUrl = URL.createObjectURL(file);
              img.src = img._objectUrl;
              preview.style.display = 'block';
            });
          });

          albumContainer.querySelectorAll('.add-photo-form').forEach(function (form) {
            form.addEventListener('submit', function (e) {
              e.preventDefault();
              var groupId = form.dataset.groupId;
              var fileInput = form.querySelector('.photo-file');
              var caption = form.querySelector('.photo-caption').value.trim();
              var file = fileInput ? fileInput.files[0] : null;
              if (!file) {
                window.LoveAdmin.toast('请选择一张照片');
                return;
              }
              window.LoveData.readLocalImage(file, function (err, dataUrl) {
                if (err) {
                  window.LoveAdmin.toast(err.message || '读取图片失败');
                  return;
                }
                var promise = window.LoveData.addPhoto(groupId, { src: dataUrl, caption: caption });
                if (promise && promise.then) {
                  promise.then(function () {
                    renderAlbum();
                    window.LoveAdmin.toast('照片已添加');
                  }).catch(function (err) {
                    window.LoveAdmin.toast('上传失败: ' + (err.message || '请重试'));
                  });
                } else {
                  renderAlbum();
                  window.LoveAdmin.toast('照片已添加');
                }
              });
            });
          });

          albumContainer.querySelectorAll('.delete-group').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var groupId = btn.dataset.groupId;
              if (confirm('确定要删除这个照片组吗？')) {
                window.LoveData.deleteAlbumGroup(groupId);
                renderAlbum();
                window.LoveAdmin.toast('照片组已删除');
              }
            });
          });

          albumContainer.querySelectorAll('.delete-photo').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
              e.stopPropagation();
              var groupId = btn.dataset.groupId;
              var src = btn.dataset.src;
              if (confirm('确定要删除这张照片吗？')) {
                window.LoveData.deletePhoto(groupId, src);
                renderAlbum();
                window.LoveAdmin.toast('照片已删除');
              }
            });
          });
        }

        function buildLightboxPhotos() {
          var thumbs = Array.from(albumContainer.querySelectorAll('.album-thumb'));
          lightboxPhotos = thumbs.map(function (thumb) {
            var img = thumb.querySelector('img');
            return {
              src: img ? (img.dataset.fullSrc || img.src) : '',
              alt: img ? img.alt : '',
              caption: img ? (img.dataset.caption || img.alt) : ''
            };
          });
        }

        function showPhoto(index) {
          if (!lightboxPhotos.length) return;
          index = (index + lightboxPhotos.length) % lightboxPhotos.length;
          currentPhotoIndex = index;
          var photo = lightboxPhotos[index];
          lightboxImg.classList.remove('loaded');
          lightboxSpinner.style.display = 'block';
          lightboxImg.alt = photo.alt;
          lightboxCaption.textContent = photo.caption;
          lightboxCounter.textContent = (index + 1) + ' / ' + lightboxPhotos.length;
          lightboxPrev.style.visibility = lightboxPhotos.length > 1 ? 'visible' : 'hidden';
          lightboxNext.style.visibility = lightboxPhotos.length > 1 ? 'visible' : 'hidden';

          var resolvedPhotoSrc = resolveMediaUrl(photo.src);
          var preload = new Image();
          preload.onload = function () {
            lightboxImg.src = resolvedPhotoSrc;
            lightboxSpinner.style.display = 'none';
            lightboxImg.classList.add('loaded');
            preloadAdjacent(index);
          };
          preload.onerror = function () {
            lightboxSpinner.style.display = 'none';
            lightboxImg.classList.add('loaded');
          };
          preload.src = resolvedPhotoSrc;
        }

        function preloadAdjacent(index) {
          [-1, 1].forEach(function (offset) {
            var i = (index + offset + lightboxPhotos.length) % lightboxPhotos.length;
            var img = new Image();
            img.src = resolveMediaUrl(lightboxPhotos[i].src);
          });
        }

        function nextPhoto() { showPhoto(currentPhotoIndex + 1); }
        function prevPhoto() { showPhoto(currentPhotoIndex - 1); }

        albumContainer.addEventListener('click', function (e) {
          var thumb = e.target.closest('.album-thumb');
          if (!thumb) return;
          if (e.target.closest('.delete-photo')) return;
          var thumbs = Array.from(albumContainer.querySelectorAll('.album-thumb'));
          var index = thumbs.indexOf(thumb);
          if (index === -1) return;
          savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
          buildLightboxPhotos();
          lightbox.classList.add('active');
          document.body.style.overflow = 'hidden';
          showPhoto(index);
        });

        lightboxPrev.addEventListener('click', function (e) { e.stopPropagation(); prevPhoto(); });
        lightboxNext.addEventListener('click', function (e) { e.stopPropagation(); nextPhoto(); });

        addGroupToggle.addEventListener('click', function () {
          addGroupForm.classList.toggle('active');
        });

        cancelAddGroup.addEventListener('click', function () {
          addGroupForm.classList.remove('active');
        });

        addGroupForm.addEventListener('submit', function (e) {
          e.preventDefault();
          var date = addGroupForm.querySelector('.group-date').value.trim();
          var title = addGroupForm.querySelector('.group-title').value.trim();
          if (!date || !title) return;
          window.LoveData.addAlbumGroup({ date: date, title: title, photos: [] });
          renderAlbum();
          addGroupForm.reset();
          addGroupForm.classList.remove('active');
          window.LoveAdmin.toast('照片组已添加');
        });

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function (e) {
          if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeLightbox();
          if (!lightbox.classList.contains('active')) return;
          if (e.key === 'ArrowLeft') prevPhoto();
          if (e.key === 'ArrowRight') nextPhoto();
        });

        // 移动端滑动手势：左右滑动切换，向下滑动关闭
        lightbox.addEventListener('touchstart', function (e) {
          if (e.touches.length !== 1) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
        }, { passive: true });

        lightbox.addEventListener('touchmove', function (e) {
          if (touchStartX === 0 || e.touches.length !== 1) return;
          var dx = e.touches[0].clientX - touchStartX;
          var dy = e.touches[0].clientY - touchStartY;
          // 水平主导时阻止默认滚动，避免与页面滚动/下拉刷新冲突
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
            e.preventDefault();
          }
        }, { passive: false });

        lightbox.addEventListener('touchend', function (e) {
          if (touchStartX === 0) return;
          var dx = e.changedTouches[0].clientX - touchStartX;
          var dy = e.changedTouches[0].clientY - touchStartY;
          var dt = Date.now() - touchStartTime;
          touchStartX = 0;
          touchStartY = 0;
          if (dt > 400 || lightboxPhotos.length <= 1) {
            if (dy > 80 && dy > Math.abs(dx)) closeLightbox();
            return;
          }
          if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0) prevPhoto();
            else nextPhoto();
          } else if (dy > 80 && dy > Math.abs(dx)) {
            closeLightbox();
          }
        });

        // 等待 API 数据加载完成后再渲染
        if (window.LoveData && window.LoveData.ready) {
          LoveData.ready().then(function () {
            renderAlbum();
            LoveData.applySiteText(document);
            var c = LoveData.getCover();
            if (c) {
              var h = document.getElementById('hero-section');
              if (h) h.style.background = 'linear-gradient(rgba(255,245,247,0.15), rgba(255,245,247,0.15)), url(' + resolveMediaUrl(c) + ') center/cover no-repeat fixed';
            }
          }).catch(function (err) {
            console.error('[Album] 初始化失败:', err);
            renderAlbum();
            LoveData.applySiteText(document);
          });
        } else {
          renderAlbum();
        }

        /* ── API 模式：自动刷新监听 ── */
        if (window.LoveData && window.LoveData.useApi && window.LoveData.onUpdate) {
          window.LoveData.onUpdate(function () {
            renderAlbum();
            LoveData.applySiteText(document);
          });
        }
      })();
    </script>
