<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xiaoxingxing.love 二维码</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe4eb 50%, #fec6d6 100%);
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px 36px;
            box-shadow: 0 24px 60px -20px rgba(244, 114, 152, 0.25);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .heart {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f47298;
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #4a3f41;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .sub {
            font-size: 14px;
            color: #9e8f94;
            margin-bottom: 28px;
        }
        #qrcode {
            display: inline-block;
            padding: 12px;
            background: white;
            border-radius: 12px;
            border: 2px solid #f3d8e0;
        }
        #qrcode img { display: block; }
        .url {
            margin-top: 20px;
            font-size: 15px;
            color: #f47298;
            font-weight: 500;
            word-break: break-all;
        }
        .hint {
            margin-top: 16px;
            font-size: 13px;
            color: #9e8f94;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding: 12px 28px;
            background: #f47298;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .btn:hover { background: #d84e7a; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">&#x2665;</div>
        <h1>我们的小宇宙</h1>
        <p class="sub">扫描二维码，进入恋爱小站</p>
        <div id="qrcode"></div>
        <p class="url">xiaoxingxing.love</p>
        <p class="hint">用微信 / 相机扫码即可访问</p>
        <button class="btn" onclick="downloadQR()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载二维码图片
        </button>
    </div>

    <script>
        var qr = new QRCode(document.getElementById("qrcode"), {
            text: "https://www.xiaoxingxing.love",
            width: 220,
            height: 220,
            colorDark: "#4a3f41",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        function downloadQR() {
            var img = document.querySelector('#qrcode img');
            if (!img) return;
            var canvas = document.createElement('canvas');
            var size = 512;
            canvas.width = size;
            canvas.height = size;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.drawImage(img, 0, 0, size, size);
            var link = document.createElement('a');
            link.download = 'xiaoxingxing-love-qrcode.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
